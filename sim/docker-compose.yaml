# LightDog 仿真编排
#
# 与上游 docker-compose 的区别：这里不构建镜像、也不挂载上游源码。
# 基础镜像是已构建好的 linorobot2:gazebo（ROS 2 Jazzy + Gazebo Harmonic），
# 只把我们的 lightdog 包装进工作区现场 colcon build。
#
# 用法：
#   cd sim && docker compose --env-file .env up -d
#   docker compose logs -f sim
#   浏览器打开 http://localhost:6080/vnc.html

services:
  sim:
    # I-001：基础镜像原本写死成可变标签 linorobot2:gazebo，没有任何办法锁定 provenance。
    # upstream.lock 把上游源码钉到了具体 commit，但镜像本身是本地构建的，重建一次标签内容
    # 就可能悄悄变 —— 「同一条 compose 在不同机器上跑出不同东西」。改成可用 SIM_IMAGE 覆盖，
    # 真机/CI 就应在 .env 里把 SIM_IMAGE 指到按 upstream.lock 的 commit 打标签的构建
    # （例如 linorobot2:gazebo-f6b0bd0，或直接 registry @sha256: 摘要）。默认值保持向后兼容。
    image: ${SIM_IMAGE:-linorobot2:gazebo}
    container_name: sim
    privileged: true
    # 以 root 跑：P3 的补丁要改 /opt/ros/jazzy/share/nav2_bringup/launch/navigation_launch.py
    # （docking_server 的 cmd_vel 出口），那个文件属 root:root 555，ros 用户改不动，
    # 而镜像里没有 sudo。整条链路（Xvfb / x11vnc / gz / ros 节点）都不依赖 root 之外的
    # 权限隔离，所以直接以 root 运行最省事。
    user: root
    network_mode: bridge
    # I-004：以前既没有 restart 也没有 healthcheck，而 entrypoint 崩溃时退的是 0
    # ——「容器已退出(0)」在 docker/systemd 眼里跟正常停止没区别，于是静默死亡、
    # 无人拉起。现在 entrypoint 在监控进程(mux/sim/slam)自己挂掉时退非零，
    # unless-stopped 就会自动重启；人为 `docker stop`(SIGTERM) 走 exit 0 且被标记
    # 为停止，不会被重启策略复活。
    restart: unless-stopped
    healthcheck:
      # 只查两个与安全最相关、且名字由我们掌控的进程在不在，不用慢的 ros2 CLI。
      # twist_mux = /cmd_vel 的兜零仲裁者；lightdog_sim.launch = 传感/驱动链路本体。
      test: ["CMD-SHELL", "pgrep -f lightdog_twist_mux.py >/dev/null && pgrep -f lightdog_sim.launch.py >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      # 仿真冷启动要 colcon build + gz 起世界 + SLAM，留足 90s 别把它误判成 unhealthy。
      start_period: 90s
    ports:
      - "5900:5900"   # x11vnc
      - "6080:6080"   # noVNC
      # P4 手机互联。手机和电脑在同一个 WiFi 下，直接访问
      # http://<本机局域网IP>:8000/ 即可。
      - "8000:8000"   # lightdog_server（MJPEG / 事件回放 / 联系人）
    environment:
      - IGN_IP=127.0.0.1
      - GZ_IP=127.0.0.1
      # 千万不要加 LIBGL_ALWAYS_SOFTWARE=1。
      # 本机 Mesa 25.2.8 + WSL 透传的 /dev/dri(card0/renderD128，d3d12) 下，
      # 它会让 gz sim 的 Sensors 系统在 RenderUtil::Init() 里直接段错误：
      #   libEGL warning: Not allowed to force software rendering when API
      #   explicitly selects a hardware device.
      #   → libgallium: driCreateNewScreen3 → Segmentation fault
      # 空着不设时 Mesa 自己回落到 kms_swrast（仍是软件渲染，实测 40 步正常收尾）。
      # 用最小相机场景 /tmp/probe.sdf 复现/验证过：有这条 rc=139，去掉 rc=0。
      - MESA_GL_VERSION_OVERRIDE=4.0
      - DISPLAY=:200
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - LINOROBOT2_BASE=${ROBOT_BASE}
      - WORLD=${WORLD:-turtlebot3_world}
      - SPAWN_X=${SPAWN_X:-0.5}
      - SPAWN_Y=${SPAWN_Y:-0.0}
      - SPAWN_YAW=${SPAWN_YAW:-0.0}
      # 充电底座在世界里的位置（P3）。patch_upstream.py 用它生成 dock_database.yaml，
      # 坐标会换算到 odom（原点 = 出生点），所以换出生点不用手改数据库。
      - DOCK_X=${DOCK_X:--2.3}
      - DOCK_Y=${DOCK_Y:-0.5}
      - DOCK_YAW=${DOCK_YAW:-0.0}
      - DOCK_APPROACH=${DOCK_APPROACH:-0.30}
      - SHOW_GUI=${SHOW_GUI:-1}
      # P4 录像根目录。挂宿主的 sim/../data 进来 = 模拟机器人的存储卡：
      # 容器重建后录像还在，宿主机上也能直接翻文件。
      - LIGHTDOG_DATA_DIR=/data
      - ENABLE_P4=${ENABLE_P4:-1}
      - ENABLE_P5=${ENABLE_P5:-1}
      - LIGHTDOG_TOKEN=${LIGHTDOG_TOKEN:-}
    working_dir: /home/ros
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      # 我们的包：挂到工作区 src 下，容器启动时现场构建
      - ../lightdog:/home/ros/linorobot2_ws/src/lightdog:rw
      # 存储卡（P4）：录像 / 事件 / 快照 / 联系人
      - ../data:/data:rw
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./patch_upstream.py:/patch_upstream.py:ro
      - ./gui.config:/gui.config:ro
      # 整个 sim/ 目录只读挂进来：p1~p5/system.sh 里的 `python3 /sim/pub_once.py`
      # 靠它。按单个文件挂的话，每加一个脚本都要改 compose + 重建容器。
      - ./:/sim:ro
