# LightDog 真机服务清单 —— install.sh 的唯一数据源
#
# 加一个节点只改这里，不要改 install.sh。
#
# 【2026-11-11 已按实车切换】到货的是 RASPBOT V2（Pi 5 16GB 直驱、四麦轮、
# USB 单目相机、Raspberry Pi OS + ROS2 Humble），见 docs/hardware_arrival.md。
# 所以所有启用单元改用 config/real_*.yaml（从仿真配置派生，只改硬件能确定的项），
# 驱动单元换成 lightdog_raspbot_driver.py。无 STM32，原 mcu 单元保留但停用。
# 仿真仍用同名的 p*_params.yaml 与 lightdog_sim.launch.py，不受影响。
#
# 字段（`|` 分隔，共 9 列，顺序固定）：
#   1 name        unit 名后缀，最终是 lightdog-<name>.service
#   2 desc        给 systemctl status 看的一句话
#   3 exe         `ros2 run lightdog <exe>`
#   4 params      config/ 下的参数文件
#   5 default     yes / no —— no 的只装 unit，不 enable（真机按需手动开）
#   6 extra       追加的 --ros-args 参数（-p xxx:=yyy），可为空
#   7 after       需要先起的 unit 后缀，逗号分隔，可为空
#   8 restart     always / on-failure
#   9 stop_timeout  秒。要盖住节点自己的优雅停机（recorder 的 flush 要 5s）
#
# 为什么粒度为「一个节点一个 unit」而不是「一个 launch 一个 unit」：
# `Restart=` 是 unit 级的。把 alert_manager 和 fall_detector 放同一个 unit 里，
# 检测器（CV，最容易崩）一崩就连状态机一起重启 —— 正在拨的求救电话会被静默清零。
# 反过来把状态机自己重启也不行，所以要能单独控制。粒度细才能真正做到崩溃隔离。
#
# ---- 安全关键层（最先起，崩了立刻回来）----
safety-mux|安全闸：速度仲裁、急停闭锁、平台限速|lightdog_twist_mux.py|real_p2_params.yaml|yes|-p estop_state_path:=/var/lib/lightdog/estop||always|8
mission|调度层：模式仲裁、低电回充、巡游|lightdog_mission.py|real_system_params.yaml|yes||safety-mux|always|10
alert|告警状态机：跌倒确认、呼叫、录像触发|lightdog_alert_manager.py|real_p5_params.yaml|yes|||always|10
# ---- 感知与控制 ----
voice|语音链路：语义指令、TTS 子进程|lightdog_voice.py|real_system_params.yaml|yes||mission|always|15
follow-det|人体检测（彩色必需，深度可选）|lightdog_person_detector.py|real_p2_params.yaml|yes|||on-failure|8
follow|跟随控制|lightdog_follower.py|real_p2_params.yaml|yes||follow-det|always|8
light-auto|自动调光（发 /led/brightness 给实车驱动）|lightdog_light_auto.py|real_p2_params.yaml|yes|||on-failure|8
dock-aruco|ArUco 视觉对准|lightdog_aruco_dock.py|real_p3_params.yaml|yes|||on-failure|10
dock-mgr|回充状态机 + 充电确认|lightdog_dock_manager.py|real_p3_params.yaml|yes||dock-aruco|always|10
# 普通相机路线：没有深度就跑不了 z_p95，默认不启用（只装 unit，不 enable）。
# 换回深度相机：本行第 5 列改 yes，并把 real_p5_params.yaml 的 depth_mode 设 'on'。
# 接入毫米波雷达：保持 no，让雷达节点自己发布 /fall/state + /fall/lying，
# alert_manager 不关心状态是谁发的。
fall-det|跌倒检测（需深度；普通相机下停用）|lightdog_fall_detector.py|real_p5_params.yaml|no|||always|8
# ---- 媒体 ----
media-rec|录像：事件前后切片 + 磁盘保留策略|lightdog_recorder.py|real_p4_params.yaml|yes|||always|20
media-http|HTTP / SSE / MJPEG 服务|lightdog_server.py|real_p4_params.yaml|yes|||always|10
# ---- 实车驱动（RASPBOT V2：Pi 直驱，没有 STM32）----
# **真车真正要 enable 的是 raspbot**：它把 /cmd_vel_muxed（含麦轮横移 linear.y）
# 送给商家驱动，发布开环 /odom、NaN 电量、软件急停闭锁，详见
# lightdog_raspbot_driver.py 文件头与 raspbot_params.yaml。
# 没有固件看门狗，靠 10Hz 持续下发 + cmd_hold 超时归零停车，别把它关掉。
raspbot|RASPBOT V2 实车驱动：麦轮全向 / 软件急停 / 开环里程计|lightdog_raspbot_driver.py|raspbot_params.yaml|yes||safety-mux|always|8
# 原 STM32 串口桥接：这台车没有可烧写的 MCU，保留单元但**不要 enable**。
# 将来外挂 STM32 / 换回通用底盘时，把上面 raspbot 改 no、这行改 yes。
mcu|下位机串口桥接（STM32，实车无此硬件）|lightdog_mcu_bridge.py|mcu_params.yaml|no||safety-mux|always|8
# ---- 只在仿真里用，真机默认不装（见 docs/hardware_readiness.md §二）----
led|把亮度翻译成 Gazebo 材质自发光|lightdog_led.py|led_visuals.yaml|no|||on-failure|8
person-sim|用 gz service 驱动仿真里的「人」|lightdog_person_sim.py|p2_params.yaml|no|||on-failure|8
