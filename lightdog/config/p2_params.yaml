# LightDog P2 参数（人体检测 / 跟随 / 光照联动）
#
# 仿真里这几个节点统一 use_sim_time: true（twist_mux 例外，理由见它自己那段）。
# 换真机时把 use_sim_time 设成 false，其余参数可沿用。
# 注意：本文件里**所有超时判据都按墙钟（time.monotonic）计**，与 use_sim_time
# 无关 —— 它们回答的是「消息多久没到了」，仿真跑多快不该影响这个结论。

/lightdog_person_detector:
  ros__parameters:
    use_sim_time: true

    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_rect_raw
    info_topic: /camera/color/camera_info

    # 检测后端：color（仿真占位，认橙色上衣）/ yolo（ultralytics，调试用）/
    # onnx（onnxruntime + 320 输入，**真机用这个**）。
    # 换后端不改输出契约（/person/present + /person/position，frame=base_link）。
    # 缺依赖时节点会报一条 error 并**自动回退到 color**，不会起不来。
    #
    # 为什么真机不用 yolo：Pi 5 没有 CUDA，PyTorch CPU 实测 1~2 FPS，而
    # frame_timeout=1.5 要求 ≥3 FPS（docs/hardware_readiness.md §8.5）。
    # onnx + 320 输入可到 6~10 FPS。导出命令：
    #   yolo export model=yolov8n.pt format=onnx imgsz=320 opset=12
    backend: color
    yolo_model: yolov8n.pt
    yolo_conf: 0.35
    yolo_person_class: 0     # COCO person=0；自训练模型给 -1 表示不限类别

    onnx_model: yolov8n_320.onnx
    # 必须与模型的**实际**输入尺寸一致。不一致时节点拒绝使用并回退到 color ——
    # 因为那时框能解出来、坐标却整体偏，且不报任何错。
    onnx_size: 320
    onnx_conf: 0.35
    onnx_iou: 0.45
    onnx_person_class: 0     # COCO person=0；-1 表示不限类别
    # Pi 5 只有 4 核，10Hz 的 twist_mux 也在同一颗 CPU 上。留 2 核给控制环，
    # 推理慢 30% 换控制环不抖，比跑满更划算（hardware_readiness.md §8.7）。
    onnx_threads: 2

    # 4wd 车型 depth_sensor_pose = xyz "-0.065 0 0.255" rpy "0 0 0"
    # 见 linorobot2_description/urdf/4wd_properties.urdf.xacro
    camera_offset: [-0.065, 0.0, 0.255]

    # 橙色上衣实测 H≈0.052（18.7°）。范围放宽到 4°~32° 容忍光照造成的偏移，
    # 靠 s_min 把低饱和的墙面/暖白灯条挡在外面（灯条 s≈0.2）。
    h_min: 0.012
    h_max: 0.090
    s_min: 0.45
    v_min: 0.15

    min_blob_px: 150       # 3m 处躯干约 2800px，5m 处约 1000px
    col_gap: 6             # 列方向允许的空隙，容忍身上阴影断开
    range_min: 0.30
    range_max: 8.00

    # 形状约束：只用来滤掉极端横向的色块，不能卡太紧。
    # 实测：1.4m 处站立躯干 bbox 高/宽 ≈ 1.45，但相机装高只有 0.3745m
    # （0.255 偏移 + 0.1195 base_link），人贴近到 0.8m 时躯干在画面里只剩
    # 一条横带（140x56px，比值 0.4），卡 1.20 会把中近距离的人一起滤掉。
    # 头部误检靠"深色头发"从颜色上解决，这里的形状约束只兜底
    # （0.55 仍能挡掉纯地砖/墙面那种扁色块）。
    aspect_min: 0.55
    min_height_px: 30

    publish_debug: true
    rate: 10.0             # 软件渲染下别给太高，10Hz 够跟随用
    # 短暂丢检仍报「有人」的容忍时长（墙钟秒）。单帧丢检就报无人会让灯闪、
    # 车一走一停；必须大于相机周期（仿真 0.67s，真机 0.033s）。
    lost_timeout: 1.0
    # 帧新鲜度（墙钟秒）。回答的是「相机管线还在不在出帧」，与仿真跑多快无关。
    # 必须大于相机周期的几倍：仿真相机 1.5Hz（0.67s/帧）、真机 30Hz。
    # 超过这个时间没有新帧就报"无人"并停止发位置 —— 否则相机冻帧/掉线后
    # 会拿最后一帧反复判"有人"，跟随器朝着画面里的幽灵一直开。
    frame_timeout: 1.5
    depth_timeout: 1.0     # 深度单独判；超时退回"参考高度/像素高度"粗估

    # ---- 深度来源（普通相机路线看这里）----
    # auto（默认，仿真/深度相机通用）：有深度就用，超时或没有就退回单目。
    # on  ：声明必须有深度。拿不到就判无人并报错，防止 align_depth 没开时
    #       静默降级成「跟得太近」。D435 用户建议设 'on'（带引号）。
    # off ：普通彩色相机。不订阅深度话题，启动日志明确写出单目精度等级。
    # ⚠️ 值必须加引号：YAML 1.1 把裸写的 on/off/yes/no 当成布尔，
    #    `depth_mode: off` 会变成 False，节点会报错并回退到 auto。
    # **真机走普通相机路线时改成 'off'**。
    depth_mode: 'auto'

    # 单目测距 z = H * fx / px_h 里的参考高度 H（米）。按后端自动选，
    # 不需要手动切换：color 只框橙色上衣用下面第一个，onnx/yolo 框整人用第二个。
    # 真机按使用者的实际身高标定 mono_height_person；写错会按比例把人算近，
    # 而 range_min 会放行 —— 见 docs/bom.md §二「常数陷阱」。
    mono_height_color: 0.62
    mono_height_person: 1.70

/lightdog_light_auto:
  ros__parameters:
    use_sim_time: true
    on_brightness: 0.85
    idle_brightness: 0.0
    fade_delay: 5.0        # 人走后先等 5s，容忍短暂丢检
    fade_time: 2.0
    step_hz: 20.0
    # 多久收不到 /person/present 就认为检测器已经死了（墙钟秒）。没有这个判据时
    # 检测器一崩，最后那条 present=True 会永久粘住，灯整夜亮着且无任何日志。
    present_timeout: 3.0
    # 语音/手机端的手动覆盖（auto | on | off）。on/off 会压过人体检测，
    # 直到收到 auto 才回到自动逻辑。
    mode_topic: /light/mode
    enabled: true

/lightdog_follower:
  ros__parameters:
    use_sim_time: true
    target_distance: 1.20
    distance_tol: 0.15
    stop_distance: 0.55
    k_linear: 0.9
    max_linear: 0.25
    k_angular: 1.4
    max_angular: 0.70
    angle_tol: 0.06
    side_turn_only: 0.9
    person_timeout: 1.5
    # /person/position 的坐标系。x 前 / y 左 的语义只对 base_link 成立；
    # 换检测器实现（例如改发 camera_link）时不同步改这里，跟随器会拒绝使用
    # 该坐标并停车 —— 这是刻意的，宁可停住也不能按错的坐标系算速度。
    expected_frame: base_link
    # dock_manager 以 10Hz 发 /dock/inhibit；它挂了以后最后那条 true 会一直
    # 留在跟随器里，表现为「跟随彻底不工作」。超过这个时间没新消息就解除。
    inhibit_timeout: 5.0
    # 调度层（lightdog_mission）的放行开关。收到 false 时先发一条零速再彻底停发，
    # 这样 twist_mux 的 follow 源会超时掉出活跃集，Nav2 才接得上（P2 §7.8）。
    # 调度层挂掉不再刷新时，超过 follow_enable_timeout 回落到本节点自己的 enabled。
    enable_topic: /follow/enable
    follow_enable_timeout: 5.0
    # 不直接发 /cmd_vel：交给 twist_mux 仲裁，再由 collision_monitor 兜碰撞
    cmd_vel_topic: /cmd_vel_follow
    enabled: true

# /cmd_vel 多源仲裁。优先级：回充 30 > 跟随 20 > Nav2 10。
# 每个源有两个窗口：
#   *_timeout  源窗口：上游还在发包吗（决定谁赢仲裁）
#   *_hold     指令窗口：最后一条指令还新鲜吗（决定能不能照抄）
# 只用一个窗口是有害的 —— 上游被 kill 后，最后一条 Twist 会在剩余窗口内被
# 原样转发，0.25m/s × 1s = 25cm 足够撞翻茶几。超过 hold 就输出零速，
# 状态里标成 follow(stale)。
# hold 要显著大于上游发布周期（跟随 10Hz → 0.1s/条），并小于 timeout。
/lightdog_twist_mux:
  ros__parameters:
    # 故意不用 sim time：超时窗口回答的是「上游还在不在发包」，
    # 与仿真跑多快无关。本机实时因子 0.22x，用 sim time 会把 0.6s 拖成 2.7s。
    use_sim_time: false
    nav_topic: /cmd_vel_smoothed
    nav_priority: 10
    nav_timeout: 0.6
    nav_hold: 0.30
    follow_topic: /cmd_vel_follow
    follow_priority: 20
    follow_timeout: 0.6
    follow_hold: 0.30
    dock_topic: /cmd_vel_dock
    dock_priority: 30
    dock_timeout: 1.0
    dock_hold: 0.50       # docking_server 状态切换时会停顿，给宽一点
    out_topic: /cmd_vel_muxed
    publish_rate: 20.0
    zero_on_idle: true
    # 平台物理上限，作用在输出上：任何上游算错了，最终发给底层的速度都不会超过它。
    # 0 = 不限制。这里给的是「仿真里不会触发」的值，真机按电机实际能力改小
    # （本项目底盘建议 0.30 / 1.0）。超速时会打一条 warn 并钳制。
    max_linear: 0.50
    max_angular: 1.50
    # 安全闸（见 lightdog_twist_mux.py 文件头）。
    # estop 是闭锁的：只有显式的 false 能解，语音/网页/物理按钮都往这里发。
    # hold 是调度层的告警按住，它停发 3s 后自动放开（不会永久冻住车）。
    estop_topic: /safety/estop
    hold_topic: /mission/hold_motion
    # 急停闭锁落盘路径。空 = 不落盘（仿真默认）。
    # 真机由 deploy/install.sh 生成的 unit 覆盖成 /var/lib/lightdog/estop ——
    # 因为那个 unit 是 Restart=always，进程崩了会自己回来，而闭锁只在内存里时
    # 「重启」就等于「自动解除急停」。改这里没用，改 deploy/nodes.conf。
    estop_state_path: ''
    # 给固件看门狗的心跳。MCU 侧 300ms 收不到 /cmd_vel 就断 PWM，
    # 心跳用来区分「上位机活着但故意零速」和「上位机死了」。
    heartbeat_topic: /safety/heartbeat

/lightdog_person_sim:
  ros__parameters:
    use_sim_time: true
    world_name: turtlebot3_world
    entity_name: person
    # 直线往返：像是从床边走到卫生间再走回来（单位 m，成对 x,y）
    # y=0.5 是 turtlebot3_world 里唯一一条没有装饰圆柱的长走廊，见 sim/.env 的说明。
    # 单程 2.4m，往返 4.8m，0.3m/s 约 16s 一圈。
    waypoints: [-0.4, 0.5, 2.0, 0.5]
    speed: 0.30
    update_hz: 5.0
    enabled: true
