# LightDog P2 参数（人体检测 / 跟随 / 光照联动）
#
# 时间相关参数依赖仿真时钟，所以四个节点统一 use_sim_time: true。
# 换真机时把 use_sim_time 设成 false 即可，其余参数可沿用。

/lightdog_person_detector:
  ros__parameters:
    use_sim_time: true

    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_rect_raw
    info_topic: /camera/color/camera_info

    # 4wd 车型 depth_sensor_pose = xyz "-0.065 0 0.255" rpy "0 0 0"
    # 见 linorobot2_description/urdf/4wd_properties.urdf.xacro
    camera_offset: [-0.065, 0.0, 0.255]

    # 橙色上衣实测 H≈0.052（18.7°）。范围放宽到 4°~32° 容忍光照造成的偏移，
    # 靠 s_min 把低饱和的墙面/暖白灯条挡在外面（灯条 s≈0.2）。
    h_min: 0.012
    h_max: 0.090
    s_min: 0.45
    v_min: 0.15

    min_blob_px: 150       # 3m 处躯干约 2800px，5m 处约 1000px
    col_gap: 6             # 列方向允许的空隙，容忍身上阴影断开
    range_min: 0.30
    range_max: 8.00

    # 形状约束：只用来滤掉极端横向的色块，不能卡太紧。
    # 实测：1.4m 处站立躯干 bbox 高/宽 ≈ 1.45，但相机装高只有 0.3745m
    # （0.255 偏移 + 0.1195 base_link），人贴近到 0.8m 时躯干在画面里只剩
    # 一条横带（140x56px，比值 0.4），卡 1.20 会把中近距离的人一起滤掉。
    # 头部误检靠"深色头发"从颜色上解决，这里的形状约束只兜底
    # （0.55 仍能挡掉纯地砖/墙面那种扁色块）。
    aspect_min: 0.55
    min_height_px: 30

    publish_debug: true
    rate: 10.0             # 软件渲染下别给太高，10Hz 够跟随用
    lost_timeout: 1.0
    # 帧新鲜度（墙钟秒）。回答的是「相机管线还在不在出帧」，与仿真跑多快无关。
    # 必须大于相机周期的几倍：仿真相机 1.5Hz（0.67s/帧）、真机 30Hz。
    # 超过这个时间没有新帧就报"无人"并停止发位置 —— 否则相机冻帧/掉线后
    # 会拿最后一帧反复判"有人"，跟随器朝着画面里的幽灵一直开。
    frame_timeout: 1.5
    depth_timeout: 1.0     # 深度单独判；超时退回"躯干高度/像素高度"粗估

/lightdog_light_auto:
  ros__parameters:
    use_sim_time: true
    on_brightness: 0.85
    idle_brightness: 0.0
    fade_delay: 5.0        # 人走后先等 5s，容忍短暂丢检
    fade_time: 2.0
    step_hz: 20.0
    enabled: true

/lightdog_follower:
  ros__parameters:
    use_sim_time: true
    target_distance: 1.20
    distance_tol: 0.15
    stop_distance: 0.55
    k_linear: 0.9
    max_linear: 0.25
    k_angular: 1.4
    max_angular: 0.70
    angle_tol: 0.06
    side_turn_only: 0.9
    person_timeout: 1.5
    # dock_manager 以 10Hz 发 /dock/inhibit；它挂了以后最后那条 true 会一直
    # 留在跟随器里，表现为「跟随彻底不工作」。超过这个时间没新消息就解除。
    inhibit_timeout: 5.0
    # 不直接发 /cmd_vel：交给 twist_mux 仲裁，再由 collision_monitor 兜碰撞
    cmd_vel_topic: /cmd_vel_follow
    enabled: true

# /cmd_vel 多源仲裁。优先级：回充 30 > 跟随 20 > Nav2 10。
# 每个源有两个窗口：
#   *_timeout  源窗口：上游还在发包吗（决定谁赢仲裁）
#   *_hold     指令窗口：最后一条指令还新鲜吗（决定能不能照抄）
# 只用一个窗口是有害的 —— 上游被 kill 后，最后一条 Twist 会在剩余窗口内被
# 原样转发，0.25m/s × 1s = 25cm 足够撞翻茶几。超过 hold 就输出零速，
# 状态里标成 follow(stale)。
# hold 要显著大于上游发布周期（跟随 10Hz → 0.1s/条），并小于 timeout。
/lightdog_twist_mux:
  ros__parameters:
    # 故意不用 sim time：超时窗口回答的是「上游还在不在发包」，
    # 与仿真跑多快无关。本机实时因子 0.22x，用 sim time 会把 0.6s 拖成 2.7s。
    use_sim_time: false
    nav_topic: /cmd_vel_smoothed
    nav_priority: 10
    nav_timeout: 0.6
    nav_hold: 0.30
    follow_topic: /cmd_vel_follow
    follow_priority: 20
    follow_timeout: 0.6
    follow_hold: 0.30
    dock_topic: /cmd_vel_dock
    dock_priority: 30
    dock_timeout: 1.0
    dock_hold: 0.50       # docking_server 状态切换时会停顿，给宽一点
    out_topic: /cmd_vel_muxed
    publish_rate: 20.0
    zero_on_idle: true

/lightdog_person_sim:
  ros__parameters:
    use_sim_time: true
    world_name: turtlebot3_world
    entity_name: person
    # 直线往返：像是从床边走到卫生间再走回来（单位 m，成对 x,y）
    # y=0.5 是 turtlebot3_world 里唯一一条没有装饰圆柱的长走廊，见 sim/.env 的说明。
    # 单程 2.4m，往返 4.8m，0.3m/s 约 16s 一圈。
    waypoints: [-0.4, 0.5, 2.0, 0.5]
    speed: 0.30
    update_hz: 5.0
    enabled: true
